<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d37"><title>중고 재고관리 Pro</title>
<style>
:root{--navy:#071d37;--blue:#2f73e8;--bg:#f5f7fb;--text:#16233a;--muted:#738096;--card:#fff;--line:#e4e9f1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.header{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:850}.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#2f73e8,#6f86f7);color:#fff;font-weight:900}
.user{color:var(--blue);font-weight:750}.body{padding:14px 12px 92px}.title{font-size:24px;font-weight:900;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid #eef1f5;border-radius:18px;padding:15px;box-shadow:0 10px 26px rgba(15,32,58,.06)}
.label{font-size:13px;color:#667188}.value{font-size:28px;font-weight:900;margin-top:5px}.muted{color:var(--muted)}
.panel{margin-top:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:11px 14px;min-height:44px;background:#edf1f7;color:#26334a;font-weight:750}.primary{background:var(--blue);color:#fff}.danger{background:#df515c;color:#fff}.outline{background:#fff;border:1px solid #cfd7e4}
.field{display:grid;gap:7px;margin:10px 0}.field label{font-weight:700;font-size:14px}.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid #d7deea;border-radius:12px;padding:10px 12px;background:#fff}
.barcode-row{display:grid;grid-template-columns:1fr auto;gap:8px}.table-wrap{overflow:auto;background:#fff;border-radius:18px;border:1px solid #edf0f5}
table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:11px 10px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{background:#f9fafc;color:#68748a;font-size:13px}td{font-size:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--navy);z-index:25;display:grid;grid-template-columns:repeat(8,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nbtn{border:0;background:transparent;color:#dbe3ee;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;min-width:0}.nbtn.active{color:#5ea1ff}.ni{font-size:19px;line-height:20px}.nl{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,#071d37,#14395f)}.login-card{width:min(430px,94vw);background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.28)}
.login-title{font-size:29px;font-weight:950;color:var(--navy)}.login-sub{margin-top:5px;color:var(--muted)}
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:10px}.modal{width:min(560px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:15px}
.cam{background:#101520;border-radius:14px;overflow:hidden;aspect-ratio:4/3;position:relative}.cam video{width:100%;height:100%;object-fit:cover;display:block}.frame{position:absolute;left:10%;right:10%;top:20%;bottom:20%;border:2px solid #fff;border-radius:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.note{font-size:12px;color:#69758a;line-height:1.45;margin-top:8px}.empty{padding:34px;text-align:center;color:#8a94a7}
@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.body{padding:12px 10px 90px}.title{font-size:22px}.header{height:62px}.brand{font-size:15px}.logo{width:34px;height:34px}}
@media(max-width:380px){.bottom{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const CONFIG={SUPABASE_URL:"",SUPABASE_PUBLISHABLE_KEY:""};
const S={view:"dashboard",session:null,inventory:[],history:[],disposals:[],local:!(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_PUBLISHABLE_KEY),client:null,channel:null};
const NAV=[["dashboard","⌂","대시보드"],["inventory","▣","중고재"],["inbound","↓","입고"],["outbound","↑","출고"],["reentry","↻","재입고"],["history","▤","입·출고"],["analytics","▥","분석"],["settings","⚙","관리자"]];
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":"&quot;");
function save(){localStorage.setItem("uip-web",JSON.stringify({inventory:S.inventory,history:S.history,disposals:S.disposals}))}
function load(){try{const d=JSON.parse(localStorage.getItem("uip-web")||"{}");S.inventory=d.inventory||[];S.history=d.history||[];S.disposals=d.disposals||[]}catch{}}
function loginUI(){document.body.innerHTML=`<div class="login"><div class="login-card"><div class="logo" style="width:64px;height:64px;border-radius:18px;margin-bottom:14px">IP</div><div class="login-title">중고 재고관리 Pro</div><div class="login-sub">휴대폰 · PC 공동사용 재고관리</div><div class="field"><label>아이디</label><input id="lid" autocomplete="username" placeholder="아이디"></div><div class="field"><label>비밀번호</label><input id="lpw" type="password" autocomplete="current-password" placeholder="비밀번호"></div><button class="btn primary" id="login" style="width:100%">로그인</button>${S.local?'<div class="note">현재 로컬 데모 모드입니다. 여러 기기에서 같은 데이터를 쓰려면 Supabase URL/Publishable Key를 설정하세요.</div>':''}</div></div>`;$("#login").onclick=login}
function shell(){document.body.innerHTML=`<header class="header"><div class="brand"><div class="logo">IP</div>중고 재고관리 Pro</div><div class="user">● ${esc(S.session?.name||"사용자")}</div></header><main class="body"><div id="content"></div></main><nav class="bottom">${NAV.map(n=>`<button class="nbtn ${S.view===n[0]?'active':''}" data-v="${n[0]}"><div class="ni">${n[1]}</div><div class="nl">${n[2]}</div></button>`).join("")}</nav>`;document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});render()}
function render(){const f={dashboard,inventory,inbound,outbound,reentry,history,disposal,analytics,settings}[S.view]||dashboard;$("#content").innerHTML=f();bind()}
function dashboard(){const q=S.inventory.reduce((a,x)=>a+Number(x.qty||0),0);return `<div class="title">대시보드</div><div class="cards"><div class="card"><div class="label">전체 재고</div><div class="value">${q} 개</div><div class="muted">현재 보유 수량</div></div><div class="card"><div class="label">입고</div><div class="value">${sumKind("입고")} 개</div><div class="muted">누적 입고</div></div><div class="card"><div class="label">출고</div><div class="value">${sumKind("출고")} 개</div><div class="muted">누적 출고</div></div><div class="card"><div class="label">재입고</div><div class="value">${sumKind("재입고")} 개</div><div class="muted">누적 재입고</div></div></div><div class="card panel"><h3>최근 작업</h3>${table(S.history.slice().reverse().slice(0,8))}</div>`}
function inventory(){return `<div class="title">중고재</div><div class="toolbar"><button class="btn primary" id="go-in">입고 등록</button><button class="btn" id="go-dis">폐기 내역</button></div><div class="table-wrap"><table><thead><tr><th>모델명</th><th>바코드번호</th><th>수량</th><th>상태</th><th>수정</th></tr></thead><tbody>${S.inventory.length?S.inventory.map((x,i)=>`<tr><td>${esc(x.model)}</td><td>${esc(x.serial)}</td><td>${x.qty}</td><td>${esc(x.status||"정상")}</td><td><button class="btn edit" data-i="${i}">수정</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">재고가 없습니다.</td></tr>`}</tbody></table></div>`}
function form(kind){const p=kind==="입고"?"in":kind==="출고"?"out":"re";return `<div class="title">${kind}</div><div class="card"><div class="field"><label>모델명</label><input id="${p}-model" placeholder="모델명"></div><div class="field"><label>바코드번호</label><div class="barcode-row"><input id="${p}-serial" autocomplete="off" placeholder="입력 또는 촬영"><button class="btn" id="scan-${p}" type="button">📷 촬영</button></div></div><div class="field"><label>수량</label><input id="${p}-qty" type="number" min="1" value="1"></div>${kind!=="입고"?`<div class="field"><label>가맹점</label><input id="${p}-store"></div>`:`<div class="field"><label>입고내용</label><select id="in-type"><option>A/S 입고</option><option>수리입고</option><option>폐기</option></select></div><div class="field" id="reason" style="display:none"><label>폐기 사유</label><textarea id="in-reason" rows="3"></textarea></div>`}<div class="actions"><button class="btn primary" id="save-${p}">${kind} 저장</button><button class="btn" id="cancel-form">취소</button></div></div>`}
function inbound(){return form("입고")} function outbound(){return form("출고")} function reentry(){return form("재입고")}
function table(rows){if(!rows.length)return '<div class="empty">내역이 없습니다.</div>';return `<div class="table-wrap"><table><thead><tr><th>일시</th><th>구분</th><th>모델명</th><th>바코드</th><th>수량</th><th>가맹점</th><th>내용</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(new Date(x.at).toLocaleString("ko-KR"))}</td><td>${esc(x.kind)}</td><td>${esc(x.model)}</td><td>${esc(x.serial)}</td><td>${x.qty||0}</td><td>${esc(x.store)}</td><td>${esc(x.note||x.reason||"")}</td></tr>`).join("")}</tbody></table></div>`}
function history(){return `<div class="title">입·출고 내역</div><div class="toolbar"><button class="btn primary" id="export">전체 자료 내보내기</button></div><div class="card">${table(S.history.slice().reverse())}</div>`}
function analytics(){const y=new Date().getFullYear();const vals=Array.from({length:12},(_,i)=>sumMonth(y,i+1,"입고"));const max=Math.max(1,...vals);return `<div class="title">월간 / 연간 분석</div><div class="card"><h3>${y}년 월간 입고 그래프</h3><div style="height:220px;display:flex;align-items:flex-end;gap:7px;padding:15px 5px 35px;border-bottom:1px solid var(--line);overflow:auto">${vals.map((v,i)=>`<div style="min-width:38px;height:${Math.max(4,v/max*175)}px;background:#2f73e8;border-radius:7px 7px 0 0;position:relative"><span style="position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10px">${v}</span><small style="position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);white-space:nowrap">${i+1}월</small></div>`).join("")}</div></div><div class="card panel"><h3>연간 내역</h3>${annualTable()}</div>`}
function annualTable(){const ys=[...new Set(S.history.map(x=>new Date(x.at).getFullYear()))].sort((a,b)=>b-a);if(!ys.length)return '<div class="empty">아직 데이터가 없습니다.</div>';return `<div class="table-wrap"><table><thead><tr><th>연도</th><th>입고</th><th>출고</th><th>재입고</th><th>폐기</th></tr></thead><tbody>${ys.map(y=>{const c=k=>S.history.filter(x=>new Date(x.at).getFullYear()===y&&x.kind===k).reduce((a,x)=>a+Number(x.qty||0),0);return `<tr><td>${y}</td><td>${c("입고")}</td><td>${c("출고")}</td><td>${c("재입고")}</td><td>${c("폐기")}</td></tr>`}).join("")}</tbody></table></div>`}
function settings(){return `<div class="title">관리자 ⚙</div><div class="card"><h3>공용 서버</h3><div class="muted">현재: ${S.local?"로컬 데모":"Supabase 공유 모드"}</div><div class="note">여러 기기에서 같은 재고를 사용하려면 Supabase를 연결하고 RLS 정책을 적용해야 합니다.</div></div><div class="card panel"><h3>전체 초기화</h3><button class="btn danger" id="reset">전체 초기화</button></div>`}
function sumKind(k){return S.history.filter(x=>x.kind===k).reduce((a,x)=>a+Number(x.qty||0),0)} function sumMonth(y,m,k){return S.history.filter(x=>{const d=new Date(x.at);return d.getFullYear()===y&&d.getMonth()+1===m&&x.kind===k}).reduce((a,x)=>a+Number(x.qty||0),0)}
function bind(){
  if($("#go-in"))$("#go-in").onclick=()=>{S.view="inbound";render()}; if($("#go-dis"))$("#go-dis").onclick=()=>{S.view="disposal";render()};
  if($("#in-type"))$("#in-type").onchange=e=>$("#reason").style.display=e.target.value==="폐기"?"grid":"none";
  if($("#save-in"))$("#save-in").onclick=()=>saveTxn("입고"); if($("#save-out"))$("#save-out").onclick=()=>saveTxn("출고"); if($("#save-re"))$("#save-re").onclick=()=>saveTxn("재입고");
  ["in","out","re"].forEach(p=>{const s=$("#"+p+"-serial"),b=$("#scan-"+p);if(b)b.onclick=()=>scanner("#"+p+"-serial");if(s)s.onclick=()=>scanner("#"+p+"-serial")});
  if($("#cancel-form"))$("#cancel-form").onclick=()=>{S.view="dashboard";render()}; if($("#export"))$("#export").onclick=exportAll;
  document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,q=prompt("수정할 수량",S.inventory[i].qty);if(q!==null&&Number(q)>=0){S.inventory[i].qty=Number(q);save();render();if(!S.local)remoteInventory(S.inventory[i])}});
  if($("#reset"))$("#reset").onclick=()=>{const p=prompt("관리자 비밀번호를 입력하세요.");if(p==="admin1234"&&confirm("전체 데이터를 초기화합니까?")){S.inventory=[];S.history=[];S.disposals=[];save();render() } else if(p!==null) alert("관리자 비밀번호가 맞지 않습니다.")};
}
async function saveTxn(kind){
 const p=kind==="입고"?"in":kind==="출고"?"out":"re",model=$("#"+p+"-model").value.trim(),serial=$("#"+p+"-serial").value.trim(),qty=Number($("#"+p+"-qty").value||0);
 if(!model||!serial||qty<=0)return alert("모델명, 바코드번호, 수량을 입력하세요.");
 const store=kind==="입고"?"":$("#"+p+"-store").value.trim();let note="",reason="";if(kind==="입고"){note=$("#in-type").value;if(note==="폐기"){reason=$("#in-reason").value.trim();if(!reason)return alert("폐기 사유를 입력하세요.");}}
 let inv=S.inventory.find(x=>x.model===model&&x.serial===serial);
 if(kind==="출고"){if(!inv||inv.qty<qty)return alert("재고가 부족합니다.");inv.qty-=qty}
 else if(kind==="폐기"){ /* not used */ }
 else if(kind==="재입고"){if(inv)inv.qty+=qty;else{inv={model,serial,qty,status:"정상"};S.inventory.push(inv)}}
 else if(note==="폐기"){ } else {if(inv)inv.qty+=qty;else{inv={model,serial,qty,status:"정상"};S.inventory.push(inv)}}
 const x={kind:note==="폐기"?"폐기":kind,model,serial,qty,store,note,reason,at:new Date().toISOString(),actor:S.session?.username||"local"};
 S.history.push(x);if(x.kind==="폐기")S.disposals.push(x);save();
 if(!S.local){await remoteHistory(x);if(inv)await remoteInventory(inv)}
 alert(kind+" 저장 완료");S.view=kind==="입고"?"inventory":kind==="출고"?"history":"history";render();
}
async function remoteHistory(x){if(!S.client)return;await S.client.from("history").insert([{kind:x.kind,model:x.model,serial:x.serial,qty:x.qty,store:x.store,note:x.note,reason:x.reason,at:x.at,actor:x.actor}])}
async function remoteInventory(x){if(!S.client||!x)return;const q=await S.client.from("inventory").select("id").eq("model",x.model).eq("serial",x.serial).maybeSingle();if(q.data)await S.client.from("inventory").update({qty:x.qty,status:x.status}).eq("id",q.data.id);else await S.client.from("inventory").insert({model:x.model,serial:x.serial,qty:x.qty,status:x.status})}
async function login(){
 const id=$("#lid").value.trim(),pw=$("#lpw").value;if(!id||!pw)return alert("아이디와 비밀번호를 입력하세요.");
 if(S.local){if((id==="admin"&&pw==="admin1234")||(id==="staff"&&pw==="staff1234")){S.session={username:id,name:id==="admin"?"관리자":"직원",id:id};shell()}else alert("로그인 실패. 데모: admin / admin1234");return}
 try{const email=id.includes("@")?id:id+"@usedinventory.local",r=await S.client.auth.signInWithPassword({email,password:pw});if(r.error)throw r.error;S.session={id:r.data.user.id,username:id,name:id};await loadRemote();subscribe();shell()}catch(e){alert("로그인 실패: "+e.message)}
}
async function loadRemote(){if(!S.client)return;const i=await S.client.from("inventory").select("*").order("model");if(!i.error)S.inventory=i.data||[];const h=await S.client.from("history").select("*").order("at");if(!h.error){S.history=h.data||[];S.disposals=S.history.filter(x=>x.kind==="폐기")}}
function subscribe(){if(!S.client)return;if(S.channel)S.client.removeChannel(S.channel);S.channel=S.client.channel("uip-live").on("postgres_changes",{event:"*",schema:"public",table:"inventory"},async()=>{await loadRemote();render()}).on("postgres_changes",{event:"*",schema:"public",table:"history"},async()=>{await loadRemote();render()}).subscribe()}
function scanner(target){
 const inp=$(target);const back=document.createElement("div");back.className="modal-back";back.innerHTML=`<div class="modal"><h3>바코드 촬영</h3><div class="cam"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div><div class="note">카메라 권한을 허용하고 바코드를 중앙에 맞춘 뒤 <b>촬영</b>을 누르세요. HTTPS 환경이 필요합니다.</div><div class="actions"><button class="btn primary" id="shot">촬영</button><button class="btn" id="close">닫기</button></div></div>`;document.body.appendChild(back);
 const v=$("#video",back);let stream=null;const close=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());back.remove()};$("#close",back).onclick=close;
 (async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});v.srcObject=stream;await v.play()}catch{ $(".note",back).textContent="카메라를 열 수 없습니다. HTTPS와 카메라 권한을 확인하세요."}})();
 $("#shot",back).onclick=async()=>{try{if("BarcodeDetector" in window){const d=new BarcodeDetector({formats:["code_128","code_39","ean_13","ean_8","upc_a","upc_e","itf_14","codabar"]}),r=await d.detect(v);if(r.length){inp.value=r[0].rawValue;close();return}}}catch{}const manual=prompt("바코드를 인식하지 못했습니다. 직접 입력하세요.");if(manual!==null){inp.value=manual.trim();close()}};
}
function exportAll(){
 const rows=[["중고재고"],["모델명","바코드","수량","상태"],...S.inventory.map(x=>[x.model,x.serial,x.qty,x.status||"정상"]),[],["전체 내역"],["구분","일시","모델명","바코드","수량","가맹점","내용","폐기사유"],...S.history.map(x=>[x.kind,x.at,x.model,x.serial,x.qty,x.store,x.note,x.reason])];
 const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\r\n");const a=document.createElement("a"),u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.href=u;a.download="중고재고관리_전체분석.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);
}
load();if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_PUBLISHABLE_KEY&&window.supabase){S.client=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);S.local=false}loginUI();
</script></body></html>
