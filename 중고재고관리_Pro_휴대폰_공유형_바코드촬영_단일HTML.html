<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans KR",system-ui,sans-serif;background:#f4f6fa;color:#1d2433}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101827,#24324b)}.card{background:#fff;border-radius:24px;box-shadow:0 20px 60px #0002;padding:28px}.login .card{width:min(420px,92vw)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand-mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#5b6cff,#9a7cff);display:grid;place-items:center;color:white;font-weight:800}.muted{color:#7c879a}.field{display:grid;gap:7px;margin:12px 0}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe1ea;border-radius:12px;padding:12px;background:#fff}.primary{background:#5b6cff;color:#fff;padding:12px 16px;border-radius:12px}.ghost{background:#eef1f7;color:#39445a;padding:10px 14px;border-radius:10px}.danger{background:#ff5d68;color:#fff;padding:10px 14px;border-radius:10px}.layout{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#111827;color:#fff;padding:20px;position:sticky;top:0;height:100vh}.side h2{margin:4px 0 20px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#b9c2d3;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#253047;color:#fff}.main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:18px;border-radius:18px;background:#fff;box-shadow:0 6px 24px #18233a0d}.stat b{font-size:28px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 24px #18233a0d;margin-top:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef1f7;font-size:12px}.modal-back{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(560px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.bar-chart{display:flex;align-items:flex-end;gap:10px;height:240px;padding:20px 8px;border-bottom:1px solid #ccd3df}.bar{flex:1;min-width:12px;background:linear-gradient(#6675ff,#8f7dff);border-radius:8px 8px 0 0;position:relative}.bar span{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-size:11px}.bar em{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.empty{padding:40px;text-align:center;color:#8993a6}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{height:auto;position:static}.nav{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.main{padding:14px}.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}

*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.layout{min-height:100vh}.main{min-width:0}.nav{overflow:auto}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.table{min-width:680px}.field input,.field select,.field textarea{width:100%;min-height:46px;font-size:16px}.field{margin-bottom:14px}.top{gap:12px;flex-wrap:wrap}.panel{overflow:hidden}.barcode-row{display:flex;gap:8px;align-items:stretch}.barcode-row input{flex:1}.barcode-btn{min-width:92px;white-space:nowrap}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}.barcode-modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.3)}.barcode-modal h3{margin:0 0 10px}.scanner{width:100%;aspect-ratio:4/3;background:#10141c;border-radius:12px;overflow:hidden;position:relative}.scanner video{width:100%;height:100%;object-fit:cover}.scanner .scan-line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions button{flex:1;min-height:46px}.camera-note{font-size:12px;color:#64748b;margin-top:8px}.mobile-bottom{display:none}@media(max-width:760px){body{font-size:15px}.layout{display:block}.side{position:sticky;top:0;z-index:50;padding:10px 12px;display:flex;align-items:center;gap:10px;overflow-x:auto}.side .brand{min-width:max-content}.side .nav{display:flex;gap:6px}.side .nav button{white-space:nowrap;padding:9px 11px}.side>div:last-child{margin-top:0!important;margin-left:auto}.main{padding:12px}.top h1{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:14px}.table{min-width:620px}.barcode-row{flex-direction:row}.barcode-btn{min-width:88px}.login{padding:16px}.login .card{width:100%;max-width:440px}.modal-backdrop{padding:8px}.barcode-modal{border-radius:14px;padding:12px}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.side .brand-mark{width:34px;height:34px}.side .brand b{font-size:13px}.side .muted{font-size:11px}.side .nav button{font-size:13px}.barcode-btn{min-width:82px;padding:0 8px}.modal-actions{flex-direction:column}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script>window.APP_CONFIG={SUPABASE_URL:"",SUPABASE_PUBLISHABLE_KEY:""};</script>

<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const C=window.APP_CONFIG||{};let sb=null,session=null,view='dashboard',data={inventory:[],history:[],users:[],disposals:[]};
if(C.SUPABASE_URL&&C.SUPABASE_PUBLISHABLE_KEY&&window.supabase)sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY);
const demoUser={id:'demo-admin',username:'admin',name:'관리자',role:'admin'};
function saveLocal(){localStorage.setItem('uip-web-data',JSON.stringify(data))}function loadLocal(){try{data=JSON.parse(localStorage.getItem('uip-web-data'))||data}catch{}}
function nav(){return [['dashboard','대시보드'],['inventory','중고재고'],['inbound','입고'],['outbound','출고'],['reentry','재입고'],['history','입,출고'],['disposal','폐기'],['analytics','분석'],['settings','관리자 ⚙']];}
function shell(){document.body.innerHTML=`<div class="layout"><aside class="side"><div class="brand"><div class="brand-mark">IP</div><div><b>중고재고관리 Pro</b><div class="muted">${esc(session?.name||'관리자')}</div></div></div><div class="nav">${nav().map(([k,n])=>`<button class="${view===k?'active':''}" data-nav="${k}">${n}</button>`).join('')}</div><div style="margin-top:18px"><button class="ghost" id="logout">로그아웃</button></div></aside><main class="main"><div id="content"></div></main></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;render()});$('#logout').onclick=logout;render()}
function render(){const f={dashboard:dashboard,inventory:inventory,inbound:inbound,outbound:outbound,reentry:reentry,history:historyView,disposal:disposal,analytics:analytics,settings:settings}[view]||dashboard;$('#content').innerHTML=f();bind();}
function dashboard(){let qty=data.inventory.reduce((a,x)=>a+Number(x.qty||0),0);return `<div class="top"><div><h1>대시보드</h1><div class="muted">모든 사용자가 같은 서버 데이터를 공유합니다.</div></div></div><div class="grid"><div class="stat"><div class="muted">중고재고</div><b>${qty}</b></div><div class="stat"><div class="muted">입고</div><b>${data.history.filter(x=>x.kind==='입고').length}</b></div><div class="stat"><div class="muted">출고</div><b>${data.history.filter(x=>x.kind==='출고').length}</b></div><div class="stat"><div class="muted">폐기</div><b>${data.disposals.length}</b></div></div><div class="panel"><h3>최근 작업</h3>${historyRows(data.history.slice(-8).reverse())}</div>`}
function inventory(){return `<div class="top"><div><h1>중고재고</h1><div class="muted">공유 재고 현황</div></div><button class="primary" id="add-stock">입고 등록</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>모델명</th><th>시리얼</th><th>수량</th><th>상태</th><th>수정</th></tr></thead><tbody>${data.inventory.length?data.inventory.map((x,i)=>`<tr><td>${esc(x.model)}</td><td>${esc(x.serial)}</td><td>${x.qty}</td><td><span class="pill">${esc(x.status||'정상')}</span></td><td><button class="ghost edit-stock" data-i="${i}">수정</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">재고가 없습니다.</td></tr>`}</tbody></table></div></div>`}
function inbound(){return `<div class="top"><div><h1>입고</h1></div></div><div class="panel"><div class="field"><label>모델명</label><input id="in-model"></div><div class="field"><label>바코드번호</label><div class="barcode-row"><input id="in-serial" inputmode="numeric" autocomplete="off" placeholder="바코드번호 입력 또는 촬영"><button class="ghost barcode-btn" id="scan" type="button">📷 촬영</button></div></div><div class="field"><label>수량</label><input id="in-qty" type="number" value="1" min="1"></div><div class="field"><label>입고내용</label><select id="in-type"><option>A/S 입고</option><option>수리입고</option><option>폐기</option></select></div><div class="field" id="reason-wrap" style="display:none"><label>폐기 사유</label><textarea id="in-reason"></textarea></div><button class="primary" id="save-in">입고 저장</button></div>`}
function outbound(){return `<div class="top"><div><h1>출고</h1></div></div><div class="panel"><div class="field"><label>모델명</label><input id="out-model"></div><div class="field"><label>바코드번호</label><div class="barcode-row"><input id="out-serial" inputmode="numeric" autocomplete="off" placeholder="바코드번호 입력 또는 촬영"><button class="ghost barcode-btn" id="scan-out" type="button">📷 촬영</button></div></div><div class="field"><label>수량</label><input id="out-qty" type="number" value="1" min="1"></div><div class="field"><label>가맹점</label><input id="out-store"></div><button class="ghost" id="scan-out">바코드 스캔</button><button class="primary" id="save-out" style="margin-top:10px">출고 저장</button></div>`}
function reentry(){return `<div class="top"><div><h1>재입고</h1></div></div><div class="panel"><div class="field"><label>모델명</label><input id="re-model"></div><div class="field"><label>바코드번호</label><div class="barcode-row"><input id="re-serial" inputmode="numeric" autocomplete="off" placeholder="바코드번호 입력 또는 촬영"><button class="ghost barcode-btn" id="scan-re" type="button">📷 촬영</button></div></div><div class="field"><label>수량</label><input id="re-qty" type="number" value="1" min="1"></div><div class="field"><label>가맹점</label><input id="re-store"></div><button class="primary" id="save-re">재입고 저장</button></div>`}
function historyRows(rows){return rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>일시</th><th>구분</th><th>모델명</th><th>시리얼</th><th>수량</th><th>가맹점</th><th>내용</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.kind)}</td><td>${esc(x.model)}</td><td>${esc(x.serial)}</td><td>${x.qty}</td><td>${esc(x.store)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">내역이 없습니다.</div>`}
function historyView(){return `<div class="top"><div><h1>입,출고 내역</h1></div><button class="primary" id="export">전체 자료 내보내기</button></div><div class="panel">${historyRows(data.history.slice().reverse())}</div>`}
function disposal(){return `<div class="top"><div><h1>폐기</h1><div class="muted">폐기 제품과 사유를 별도로 확인합니다.</div></div></div><div class="panel">${data.disposals.length?historyRows(data.disposals.slice().reverse()):'<div class="empty">폐기 내역이 없습니다.</div>'}</div>`}
function analytics(){let y=new Date().getFullYear();let months=Array.from({length:12},(_,i)=>i+1);let vals=months.map(m=>data.history.filter(x=>new Date(x.at).getFullYear()===y&&new Date(x.at).getMonth()+1===m&&x.kind==='입고').reduce((a,x)=>a+Number(x.qty||0),0));let max=Math.max(1,...vals);return `<div class="top"><div><h1>분석</h1><div class="muted">월간 / 연간 내역과 그래프</div></div><button class="primary" id="export">분석자료 내보내기</button></div><div class="panel"><h3>${y}년 월간 입고 그래프</h3><div class="bar-chart">${vals.map((v,i)=>`<div class="bar" style="height:${Math.max(4,v/max*180)}px"><em>${v}</em><span>${i+1}월</span></div>`).join('')}</div></div><div class="panel"><h3>연간 요약</h3>${yearSummary()}</div>`}
function yearSummary(){let ys=[...new Set(data.history.map(x=>new Date(x.at).getFullYear()))].sort((a,b)=>b-a);return ys.length?`<div class="table-wrap"><table class="table"><thead><tr><th>연도</th><th>입고</th><th>출고</th><th>재입고</th><th>폐기</th></tr></thead><tbody>${ys.map(y=>{let r=k=>data.history.filter(x=>new Date(x.at).getFullYear()===y&&x.kind===k).reduce((a,x)=>a+Number(x.qty||0),0);return `<tr><td>${y}</td><td>${r('입고')}</td><td>${r('출고')}</td><td>${r('재입고')}</td><td>${r('폐기')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">아직 데이터가 없습니다.</div>'}
function settings(){return `<div class="top"><div><h1>관리자 설정</h1></div></div><div class="panel"><h3>계정 관리</h3><p class="muted">실제 공동사용 계정은 Supabase Auth에서 관리합니다. 아래 버튼으로 관리 화면을 열 수 있습니다.</p><button class="ghost" id="supabase-help">계정 관리 안내</button></div><div class="panel"><h3>전체 초기화</h3><p class="muted">공유 데이터 전체 삭제는 안전을 위해 서버 SQL/관리자 절차로 수행합니다.</p><button class="danger" id="reset">전체 초기화</button></div>`}
function bind(){if($('#in-type'))$('#in-type').onchange=e=>$('#reason-wrap').style.display=e.target.value==='폐기'?'block':'none';if($('#save-in'))$('#save-in').onclick=()=>{let x={kind:'입고',model:$('#in-model').value,serial:$('#in-serial').value,qty:+$('#in-qty').value||1,note:$('#in-type').value,store:'',at:new Date().toISOString()};if(x.note==='폐기'){x.reason=$('#in-reason').value;x.kind='폐기';data.disposals.push(x)}let inv=data.inventory.find(i=>i.model===x.model&&i.serial===x.serial);if(x.kind==='입고'){if(inv)inv.qty+=x.qty;else data.inventory.push({model:x.model,serial:x.serial,qty:x.qty,status:'정상'})}data.history.push(x);saveLocal();syncInsert(x);alert('저장되었습니다.');render()};if($('#save-out'))$('#save-out').onclick=()=>changeStock('출고','out');if($('#save-re'))$('#save-re').onclick=()=>changeStock('재입고','re');if($('#export'))$('#export').onclick=exportAll;document.querySelectorAll('.edit-stock').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;let n=prompt('수정할 수량',data.inventory[i].qty);if(n!==null){data.inventory[i].qty=+n||0;saveLocal();syncInventory(data.inventory[i]);render()}});if($('#reset'))$('#reset').onclick=()=>{let p=prompt('관리자 비밀번호를 입력하세요');if(p==='admin1234'){data={inventory:[],history:[],users:[],disposals:[]};saveLocal();render();alert('초기화되었습니다.')}else if(p!==null)alert('관리자 비밀번호가 맞지 않습니다.')};if($('#scan'))$('#scan').onclick=()=>openScanner('#in-serial');if($('#scan-out'))$('#scan-out').onclick=()=>openScanner('#out-serial');if($('#scan-re'))$('#scan-re').onclick=()=>openScanner('#re-serial');['#in-serial','#out-serial','#re-serial'].forEach(sel=>{const el=$(sel);if(el)el.onclick=()=>openScanner(sel)})}
function changeStock(kind,p){let ids=p==='out'?['out-model','out-serial','out-qty','out-store']:['re-model','re-serial','re-qty','re-store'];let x={kind,model:$('#'+ids[0]).value,serial:$('#'+ids[1]).value,qty:+$('#'+ids[2]).value||1,store:$('#'+ids[3]).value,note:'',at:new Date().toISOString()};let inv=data.inventory.find(i=>i.model===x.model&&i.serial===x.serial);if(kind==='출고'){if(!inv||inv.qty<x.qty)return alert('재고가 부족합니다.');inv.qty-=x.qty}else{if(inv)inv.qty+=x.qty;else data.inventory.push({model:x.model,serial:x.serial,qty:x.qty,status:'正常'})}data.history.push(x);saveLocal();syncInsert(x);syncInventory(inv||data.inventory.at(-1));alert('저장되었습니다.');render()}
async function syncInsert(x){if(!sb)return;try{await sb.from('history').insert([{...x,actor_id:session?.id||null}])}catch(e){console.warn(e)}}async function syncInventory(x){if(!sb||!x)return;try{let {data:r}=await sb.from('inventory').select('id').eq('model',x.model).eq('serial',x.serial).maybeSingle();if(r)await sb.from('inventory').update({qty:x.qty,status:x.status}).eq('id',r.id);else await sb.from('inventory').insert({model:x.model,serial:x.serial,qty:x.qty,status:x.status})}catch(e){console.warn(e)}}
async function exportAll(){let csv='구분,일시,모델명,시리얼,수량,가맹점,내용,폐기사유\n'+data.history.map(x=>[x.kind,x.at,x.model,x.serial,x.qty,x.store,x.note,x.reason].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='중고재고관리_전체분석.csv';a.click();URL.revokeObjectURL(a.href);setTimeout(()=>{let mail=prompt('받을 이메일 주소(선택)');if(mail)location.href='mailto:'+encodeURIComponent(mail)+'?subject='+encodeURIComponent('중고재고관리 분석자료')+'&body='+encodeURIComponent('다운로드한 CSV 파일을 첨부해 보내주세요.')},200)}
async function login(){const id=$('#login-id').value.trim(),pw=$('#login-pw').value;if(sb){let email=id.includes('@')?id:id+'@usedinventory.local';let {data:d,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)return alert('로그인 실패: '+error.message);session={id:d.user.id,username:id,name:id,role:'user'};await loadRemote();startRealtime()}else{if((id==='admin'&&pw==='admin1234')||(id==='staff'&&pw==='staff1234'))session=id==='admin'?demoUser:{id:'demo-staff',username:'staff',name:'직원',role:'user'};else return alert('아이디 또는 비밀번호가 맞지 않습니다.\n데모: admin / admin1234');loadLocal()}shell()}
async function loadRemote(){try{let {data:p}=await sb.from('profiles').select('*').eq('id',session.id).maybeSingle();if(p){session={...session,...p}}let {data:i}=await sb.from('inventory').select('*').order('model');if(i)data.inventory=i;let {data:h}=await sb.from('history').select('*').order('at');if(h){data.history=h;data.disposals=h.filter(x=>x.kind==='폐기')} }catch(e){console.warn(e)}}
let realtimeChannel=null;function startRealtime(){if(!sb)return;if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel('uip-shared-data').on('postgres_changes',{event:'*',schema:'public',table:'inventory'},async()=>{let {data:i}=await sb.from('inventory').select('*').order('model');if(i){data.inventory=i;render()}}).on('postgres_changes',{event:'*',schema:'public',table:'history'},async()=>{let {data:h}=await sb.from('history').select('*').order('at');if(h){data.history=h;data.disposals=h.filter(x=>x.kind==='폐기');render()}}).subscribe()}
async function logout(){if(realtimeChannel&&sb){await sb.removeChannel(realtimeChannel);realtimeChannel=null}if(sb)await sb.auth.signOut();session=null;view='dashboard';renderLogin()}
function renderLogin(){document.body.innerHTML=`<div class="login"><div class="card"><div class="brand"><div class="brand-mark">IP</div><div><h2 style="margin:0">중고재고관리 Pro</h2><div class="muted">공유형 웹 관리 시스템</div></div></div><div class="field"><label>아이디</label><input id="login-id" autocomplete="username"></div><div class="field"><label>비밀번호</label><input id="login-pw" type="password" autocomplete="current-password"></div><button class="primary" style="width:100%;margin-top:8px" id="login">로그인</button><p class="muted" style="font-size:12px;margin-top:14px">서버 연결 전 데모: admin / admin1234</p></div></div>`;$('#login').onclick=login}
loadLocal();renderLogin();

let scannerStream=null, scannerReader=null;
function openScanner(target){
  const modal=document.createElement('div'); modal.className='modal-backdrop'; modal.innerHTML=`<div class="barcode-modal" role="dialog" aria-modal="true"><h3>바코드 촬영</h3><div class="scanner"><video id="barcode-video" autoplay playsinline muted></video><div class="scan-line"></div></div><div class="camera-note">카메라 권한을 허용한 뒤 촬영 버튼을 누르세요. HTTPS 환경에서 사용해야 합니다.</div><div class="modal-actions"><button class="primary" id="capture-barcode">촬영</button><button class="ghost" id="close-barcode">닫기</button></div></div>`;
  document.body.appendChild(modal);
  const video=modal.querySelector('#barcode-video');
  const close=()=>{try{scannerReader?.reset();}catch{};if(scannerStream)scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;modal.remove()};
  modal.querySelector('#close-barcode').onclick=close;
  (async()=>{try{scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=scannerStream;await video.play();}catch(e){modal.querySelector('.camera-note').textContent='카메라를 열 수 없습니다. 사이트가 HTTPS인지, 브라우저의 카메라 권한이 허용되어 있는지 확인하세요.';}})();
  modal.querySelector('#capture-barcode').onclick=async()=>{
    const finish=v=>{const input=document.querySelector(target);if(input){input.value=v;input.dispatchEvent(new Event('input',{bubbles:true}));}close()};
    if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code']});const codes=await detector.detect(video);if(codes?.length)return finish(codes[0].rawValue);alert('바코드를 찾지 못했습니다. 바코드가 화면 중앙에 보이도록 다시 촬영해주세요.');return;}catch(e){}}
    if(window.ZXingBrowser){try{if(!scannerReader)scannerReader=new ZXingBrowser.BrowserMultiFormatReader();const result=await scannerReader.decodeOnceFromVideoDevice(undefined,video);if(result?.getText())return finish(result.getText());}catch(e){}}
    alert('이 브라우저에서 바코드를 인식하지 못했습니다. 밝은 곳에서 바코드를 화면에 맞춘 뒤 다시 촬영해주세요.');
  };
}

</script>
